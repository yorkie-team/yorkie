{{- if not .Values.yorkie.args.clusterSecretExistingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "yorkie.clusterSecretName" . }}
  namespace: {{ .Values.yorkie.namespace }}
  labels:
    app.kubernetes.io/name: {{ .Values.yorkie.name }}
    app.kubernetes.io/instance: {{ .Values.yorkie.name }}
    app.kubernetes.io/component: server
    app.kubernetes.io/part-of: {{ .Values.yorkie.name }}
type: Opaque
stringData:
  {{ .Values.yorkie.args.clusterSecretKey }}: {{ include "yorkie.clusterSecret" . | quote }}
{{- end }}
