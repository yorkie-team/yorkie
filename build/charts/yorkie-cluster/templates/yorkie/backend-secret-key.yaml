{{- /*
The credentials the server would otherwise take as command-line flags: the
admin token signing key, the MongoDB connection URI (which carries the
database password), the cluster RPC secret and the GitHub OAuth client secret.
The Deployment hands them over as environment variables, because an argument is
readable in /proc/<pid>/cmdline and through the pprof `/debug/pprof/cmdline`
endpoint, which this chart enables and serves on the profiling port.

The signing key (--backend-secret-key) must be the same on every replica: the
gateway may route an admin request to any pod, and a pod accepts only tokens
signed with its own key. Without a key each pod would generate its own, so the
chart refuses to render instead. The checks below mirror the ones the server
runs at startup (validateSecretKey in server/server.go), so a key it would
reject fails the render rather than crash-looping every pod. The chart cannot
see inside an existing Secret, so a key kept there is checked only by the
server.

The cluster secret (--cluster-secret) is required for the same kind of reason,
though the server itself only warns about it: a server without one accepts
every ClusterService request, and this chart routes ClusterService through the
ingress gateway, since nodes call each other through it. Rendering a release
whose cluster RPCs anyone outside can make would be the wrong default, so the
render fails as well when neither value is set.

This Secret is created and owned by the chart, and its name deliberately does
not match the one an operator creates for secretKeyExistingSecret or
clusterSecretExistingSecret: sharing a name would make Helm delete the
operator's Secret, or refuse to adopt it, when a release moves between the two.
*/}}
{{- $args := .Values.yorkie.args }}
{{- $name := printf "%s-credentials" .Values.yorkie.name }}
{{- if eq ($args.secretKeyExistingSecret | default "") $name }}
{{- fail (printf "yorkie.args.secretKeyExistingSecret must not be %q: that Secret is created and owned by this chart, so pointing at it would make Helm delete the key it holds. Keep your own key in a Secret under another name, such as %s-backend-secret-key." $name .Values.yorkie.name) }}
{{- end }}
{{- $clusterExisting := trim (toString ($args.clusterSecretExistingSecret | default "")) }}
{{- if eq $clusterExisting $name }}
{{- fail (printf "yorkie.args.clusterSecretExistingSecret must not be %q: that Secret is created and owned by this chart, so pointing at it would make Helm delete the secret it holds. Keep your own secret in a Secret under another name, such as %s-cluster-secret." $name .Values.yorkie.name) }}
{{- end }}
{{- $clusterSecret := "" }}
{{- if not $clusterExisting }}
{{- $clusterSecret = trim (toString ($args.clusterSecret | default "")) }}
{{- if not $clusterSecret }}
{{- fail "yorkie.args.clusterSecret (non-blank) or yorkie.args.clusterSecretExistingSecret is required: it authenticates inter-node cluster RPCs, and a server without it accepts every ClusterService request, including ones that read or purge any document, from anyone who can reach the ingress gateway this chart publishes. Generate one with: openssl rand -base64 24" }}
{{- end }}
{{- end }}
{{- $key := "" }}
{{- if not $args.secretKeyExistingSecret }}
{{- $key = trim (toString ($args.secretKey | default "")) }}
{{- if not $key }}
{{- fail "yorkie.args.secretKey (non-blank) or yorkie.args.secretKeyExistingSecret is required: it signs admin tokens and must be the same on every replica. Generate one with: openssl rand -base64 32" }}
{{- end }}
{{- if eq (lower $key) "yorkie-secret" }}
{{- fail "yorkie.args.secretKey is the public default \"yorkie-secret\": anyone can sign admin tokens with it, and the server refuses to start. Generate a random key with: openssl rand -base64 32" }}
{{- end }}
{{- if lt (len $key) 32 }}
{{- fail (printf "yorkie.args.secretKey is %d characters: the server refuses an admin token signing key shorter than 32, since a short key can be found by trying keys against an issued token. Generate one with: openssl rand -base64 32" (len $key)) }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Values.yorkie.namespace }}
type: Opaque
stringData:
  {{- if $key }}
  {{- /* Trimmed, so the value stored matches the one the server uses. */}}
  secret-key: {{ $key | quote }}
  {{- end }}
  {{- if $args.dbConnectionUri }}
  mongo-connection-uri: {{ $args.dbConnectionUri | quote }}
  {{- else }}
  mongo-connection-uri: {{ printf "mongodb://%s:%s@%s-mongos.%s.svc.cluster.local:27017/%s?authSource=admin" .Values.mongodb.credentials.databaseAdmin.username .Values.mongodb.credentials.databaseAdmin.password (index .Values "yorkie-mongodb" "fullnameOverride") .Values.yorkie.namespace $args.dbName | quote }}
  {{- end }}
  {{- if $clusterSecret }}
  {{- /* Trimmed, so the value stored matches the one the server uses. */}}
  cluster-secret: {{ $clusterSecret | quote }}
  {{- end }}
  {{- if $args.githubClientSecret }}
  github-client-secret: {{ $args.githubClientSecret | quote }}
  {{- end }}
