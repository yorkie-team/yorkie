{{- /*
The admin token signing key (--backend-secret-key). Every replica must share
it: the gateway may route an admin request to any pod, and a pod accepts only
tokens signed with its own key. Without a key each pod would generate its own,
so the chart refuses to render instead. The chart cannot see inside an
existing Secret; the server refuses to start if its key is blank.
*/}}
{{- $args := .Values.yorkie.args }}
{{- if and (not $args.secretKeyExistingSecret) (not (trim (toString ($args.secretKey | default "")))) }}
{{- fail "yorkie.args.secretKey (non-blank) or yorkie.args.secretKeyExistingSecret is required: it signs admin tokens and must be the same on every replica. Generate one with: openssl rand -base64 32" }}
{{- end }}
{{- if not $args.secretKeyExistingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.yorkie.name }}-backend-secret-key
  namespace: {{ .Values.yorkie.namespace }}
type: Opaque
stringData:
  secret-key: {{ $args.secretKey | quote }}
{{- end }}
