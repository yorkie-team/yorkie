apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: {{ .Values.yorkie.name }}
  namespace: {{ .Values.yorkie.namespace }}
spec:
  hosts:
    - "*"
  gateways:
    - {{ .Values.yorkie.name }}-gateway
  http:
    # route /auth paths with fixed shard key for GitHub OAuth session consistency
    - name: {{ .Values.yorkie.name }}-auth-service
      match:
        - uri:
            prefix: "/auth"
      route:
        - destination:
            host: {{ .Values.yorkie.name }}
            port:
              number: {{ .Values.yorkie.ports.rpcPort }}
      headers:
        request:
          set:
            x-shard-key: "auth-session"
      corsPolicy:
        allowOrigins:
          - exact: "*"
        allowMethods:
          - POST
          - GET
          - OPTIONS
          - PUT
          - DELETE
        allowHeaders:
          - grpc-timeout
          - content-type
          - keep-alive
          - user-agent
          - cache-control
          - content-transfer-encoding
          - custom-header-1
          - x-accept-content-transfer-encoding
          - x-accept-response-streaming
          - x-user-agent
          - x-yorkie-user-agent
          - x-grpc-web
          - authorization
          - x-api-key
          - x-shard-key
          - connect-protocol-version
          - connect-timeout-ms
        maxAge: 1728s
        exposeHeaders:
          - custom-header-1
          - grpc-status
          - grpc-message
          - grpc-status-details-bin
        allowCredentials: true
    # ClusterService is server-to-server only: its RPCs take the project out of
    # the request message instead of going through project auth, and they can
    # detach, purge or read documents by project ID alone. Reject it at the
    # gateway unless the caller presents a cluster-secret header, so an
    # anonymous caller off the internet never reaches the handler.
    #
    # The rule cannot simply drop /yorkie.v1.ClusterService/*: nodes reach each
    # other through this same gateway (--backend-gateway-addr points at the
    # gateway Service), so legitimate inter-node traffic arrives here too. What
    # separates it is the header, which the server then verifies in constant
    # time - this is the outer of the two gates, not a replacement for it.
    #
    # x-cluster-secret is deliberately absent from the CORS allowHeaders lists
    # below, so a browser cannot be talked into sending one cross-origin.
    - name: {{ .Values.yorkie.name }}-cluster-service-deny
      match:
        - uri:
            prefix: "/yorkie.v1.ClusterService/"
          withoutHeaders:
            x-cluster-secret:
              regex: ".*"
      directResponse:
        status: 404
        body:
          string: "not found"
    # route /yorkie.v1 paths (client SDK sets x-shard-key)
    - name: {{ .Values.yorkie.name }}-rpc-service
      match:
        - uri:
            prefix: "/yorkie.v1"
      route:
        - destination:
            host: {{ .Values.yorkie.name }}
            port:
              number: {{ .Values.yorkie.ports.rpcPort }}
      corsPolicy:
        allowOrigins:
          - exact: "*"
        allowMethods:
          - POST
          - GET
          - OPTIONS
          - PUT
          - DELETE
        allowHeaders:
          - grpc-timeout
          - content-type
          - keep-alive
          - user-agent
          - cache-control
          - content-transfer-encoding
          - custom-header-1
          - x-accept-content-transfer-encoding
          - x-accept-response-streaming
          - x-user-agent
          - x-yorkie-user-agent
          - x-grpc-web
          - authorization
          - x-api-key
          - x-shard-key
          - connect-protocol-version
          - connect-timeout-ms
        maxAge: 1728s
        exposeHeaders:
          - custom-header-1
          - grpc-status
          - grpc-message
          - grpc-status-details-bin
        allowCredentials: true
