{{- if .Values.mongodb.enabled }}
{{- /*
The passwords of the three MongoDB users the Percona operator creates from this
Secret (it reads it as cr.spec.secrets.users). None of them has a default any
more, so a blank one fails the render.

Blankness alone is not enough of a gate: this chart published `admin`,
`useradmin` and `clusteradmin` in its own values.yaml for years, so a release
carried over from before — an operator passing a copy of the old values file
with -f, or a `helm upgrade --reuse-values` of a release installed back then —
still supplies those values explicitly and would render happily with a database
admin password anyone can read in Yorkie's source. They are rejected by value as
well, the way yorkie.args.secretKey rejects "yorkie-secret" in
templates/yorkie/backend-secret-key.yaml.

Values are trimmed, so a password that arrives with a trailing newline (from a
file or a command substitution) is stored as the server will send it, and
matches the connection URI backend-secret-key.yaml builds from the same value.
*/}}
{{- $published := dict "databaseAdmin" "admin" "userAdmin" "useradmin" "clusterAdmin" "clusteradmin" }}
{{- $passwords := dict }}
{{- range $field, $old := $published }}
{{- $password := trim (toString ((index $.Values.mongodb.credentials $field | default (dict)).password | default "")) }}
{{- if not $password }}
{{- fail (printf "mongodb.credentials.%s.password (non-blank) is required: it is the password of one of the three MongoDB users this chart creates, and the chart ships no default for it. Generate one with: openssl rand -base64 32" $field) }}
{{- end }}
{{- if eq (lower $password) $old }}
{{- fail (printf "mongodb.credentials.%s.password is %q, the default this chart used to publish in its own values.yaml: anyone who can reach the database can log in with it. Generate a random password with: openssl rand -base64 32" $field $old) }}
{{- end }}
{{- $_ := set $passwords $field $password }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: mongodb-users
  namespace: {{ .Values.yorkie.namespace }}
type: Opaque
stringData:
  MONGODB_DATABASE_ADMIN_USER: {{ .Values.mongodb.credentials.databaseAdmin.username | quote }}
  MONGODB_DATABASE_ADMIN_PASSWORD: {{ index $passwords "databaseAdmin" | quote }}
  MONGODB_USER_ADMIN_USER: {{ .Values.mongodb.credentials.userAdmin.username | quote }}
  MONGODB_USER_ADMIN_PASSWORD: {{ index $passwords "userAdmin" | quote }}
  MONGODB_CLUSTER_ADMIN_USER: {{ .Values.mongodb.credentials.clusterAdmin.username | quote }}
  MONGODB_CLUSTER_ADMIN_PASSWORD: {{ index $passwords "clusterAdmin" | quote }}
{{- end }}
