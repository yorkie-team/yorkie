{{- if index .Values "yorkie-analytics" "starrocks" "enabled" }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.name }}-init-starrocks-database-script
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/component: starrocks
    app.kubernetes.io/part-of: yorkie-analytics
# The payload lives in ../../files as real .sql and .sh files rather than
# inline block scalars, so that shell and SQL tooling can read it -- and so
# that CI can. `.github/workflows/ci.yml` decides whether to run the `build`
# job, and therefore `go test`, from the changed paths, and it negates
# `build/charts/**/*.yaml` as documentation. The provisioning these files
# perform is asserted by server/backend/warehouse/provisioning_test.go; while
# it was inline here, a pull request editing only the init script skipped the
# very test that guards it. `.sql` and `.sh` match no negation, so such a
# change now runs the build.
data:
  init-create-table.sql: |
    {{- .Files.Get "files/init-create-table.sql" | nindent 4 }}

  init-create-mv.sql: |
    {{- .Files.Get "files/init-create-mv.sql" | nindent 4 }}

  init-create-summary.sql: |
    {{- .Files.Get "files/init-create-summary.sql" | nindent 4 }}

  # `tpl` because this one interpolates the Kafka broker and topic values.
  init-create-routine-load.sql: |
    {{- tpl (.Files.Get "files/init-create-routine-load.sql") . | nindent 4 }}

  # `tpl` because this one interpolates .Values.namespace into the FE host.
  init-starrocks-database.sh: |
    {{- tpl (.Files.Get "files/init-starrocks-database.sh") . | nindent 4 }}
{{- end }}
