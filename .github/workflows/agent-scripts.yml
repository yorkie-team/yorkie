# The test lane for `scripts/agent` — the Node package behind the `@claude`
# command surface (docs/design/agent-command-verbs.md).
#
# A workflow of its own, because this package is not part of what `ci.yml`
# builds: it has its own npm lockfile and sits outside the product's build.
# Adding it to `ci.yml` would put a second install and a second test suite on
# the critical path of every product pull request, for a change that touches
# neither.
#
# TRIGGERED BY WORKFLOW CHANGES TOO, and that is not over-collection: several of
# these tests assert that a module and a workflow agree — the paged-latch
# literal, the inline finding-selection copy, the upload steps that would
# silently upload nothing without `include-hidden-files`. Those guards read
# `.github/workflows/` at run time, so a change to any workflow can break them.
# Scoping this to `scripts/agent/**` would leave exactly the drift the guards
# exist to catch outside the lane that runs them.
#
# `.github/agent-harness/**` is the repository's own configuration for these
# scripts and the test that grades it, and `.github/actions/**` holds the
# toolchain action the workflows call; a change to either runs this lane for
# the same reason a change to the scripts does.
#
# THE SAME FILE IN EVERY REPOSITORY, so the path filters name only what every
# repository has. `repo.test.mjs` also reads files that are one repository's
# own (a build file, a lint configuration) and a change to one of those does
# not start this lane: a `paths:` filter cannot be read from configuration.
# So it also runs WEEKLY, on `main`: a linter bumped in a build file, or a
# toolchain version moved, is checked against the toolchain action's pins
# within a week instead of at the next harness change. The weekly run also
# warns a repository that copied these files when the repository they came
# from has moved on (the last step of the `test` job); the issue that tells
# its people so is `agent-upstream-notify.yml`'s, which can write one.
name: Agent Scripts

on:
  schedule:
    - cron: "23 5 * * 1"
  push:
    branches: [main]
    paths:
      - "scripts/agent/**"
      - ".github/agent-harness/**"
      - ".github/actions/**"
      - ".github/workflows/**"
  pull_request:
    branches: [main]
    paths:
      - "scripts/agent/**"
      - ".github/agent-harness/**"
      - ".github/actions/**"
      - ".github/workflows/**"

# Read-only: this job needs the tree and nothing else. No model is called here —
# the suite is offline, and the Agent SDK is installed only because the modules
# import it.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          # No step here talks to the API, so leaving the token in .git/config
          # would be a credential nothing needs.
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # `npm ci`, not `npm install`: the committed lockfile is the point. This
      # package sits outside any workspace and pins its own transitive security
      # overrides, which only a lockfile-exact install reproduces.
      #
      # `--ignore-scripts` because this job installs from the PULL REQUEST's own
      # tree, so the lockfile is whatever the contributor wrote — and an install
      # lifecycle script in a dependency it names would otherwise run here. The
      # job holds no secrets and only `contents: read`, so the blast radius is a
      # runner, but the package needs no lifecycle scripts (zod and the Agent
      # SDK are plain JavaScript) and refusing them costs nothing. The trusted
      # `deps` job in agent-review-on-demand.yml sidesteps this differently, by
      # installing from `ref: main`.
      - name: Install dependencies
        run: npm ci --no-audit --no-fund --ignore-scripts
        working-directory: scripts/agent

      - name: Test
        run: npm test
        working-directory: scripts/agent

      # The suite above grades the harness code against a fixture configuration,
      # so it says nothing about the values this repository actually runs on.
      # This one reads `.github/agent-harness/` itself. A separate step, so a
      # failure names which half broke.
      - name: Test this repository's harness configuration
        run: npm run test:repo
        working-directory: scripts/agent

      # IS THIS COPY THE ONE IT SAYS IT IS? The suite above already fails when a
      # shared file differs from `scripts/agent/MANIFEST.sha256`, and when that
      # manifest is not the one `.github/agent-harness/upstream.json` records.
      # Both are local, so both can be satisfied by editing the record. This
      # asks the repository the record names: it fetches the manifest at the
      # recorded commit and compares, and FAILS if it cannot fetch it — a check
      # that passes when it could not look is not a check. It also warns,
      # without failing, when that repository's default branch has moved on.
      #
      # In the repository the shared files are written in, the record says
      # `repository: null` and this step says so and exits 0.
      #
      # The job's own read-only token, for the rate limit: it can read any
      # public repository's contents and nothing else, and it goes to
      # api.github.com only. An upstream that is private would need a token of
      # its own, which this step does not take.
      - name: Compare the shared files with the repository they were copied from
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run check:upstream
        working-directory: scripts/agent

  # THE TEST SUITE CANNOT CATCH THIS CLASS, AND ONE OF THEM SHIPPED.
  # `agent-review-panel.yml` named `cancelled()` in an `env:` value, where GitHub
  # does not allow it. That is not a step that fails when it runs — GitHub
  # refuses to LOAD the file, so every push produced a nameless, job-less failed
  # run and the panel never executed once. Nothing noticed: the workflow is
  # `workflow_run`-triggered, so "no panel ran" and "no CI finished yet" look
  # identical from the outside, and five review rounds plus CodeRabbit read the
  # file as YAML rather than as a workflow.
  #
  # The suite's cross-file guards read these files as text, and a YAML parse only
  # proves they are YAML. actionlint is the piece that checks them the way the
  # service does: expression contexts, job graph, action inputs, `runs-on`.
  #
  # Shell linting is left off deliberately. These workflows carry large
  # `github-script` bodies and heredoc-heavy `run:` blocks that shellcheck reads
  # as its own dialect, and a lane that is noisy from its first run is a lane
  # people learn to ignore. The startup-failure class is what this exists for.
  #
  # SCOPED TO THE WHOLE DIRECTORY, which is what triggers this lane, with no
  # ignore list. That symmetry is the point: the startup-failure class this
  # lane exists for is not specific to `agent-*.yml`, and a `ci.yml` GitHub
  # refuses to load takes the product's lane down the same way it took the
  # panel down.
  #
  # WIDENING MEANS OWNING WHAT IS NEWLY GRADED, including what actionlint does
  # NOT report. It reads an action's inputs and expressions, never its runtime,
  # so an action pinned to a runtime GitHub is removing (`using: node16`) is in
  # scope and reads as clean here.
  lint-workflows:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # NO PATH ARGUMENTS. Given none, actionlint lints every workflow in
      # `.github/workflows/` by definition — which is both simpler than a glob
      # and strictly wider: `*.yml` silently misses a future `.yaml`, a
      # spelling GitHub accepts. Verified by planting one and watching the
      # glob form report nothing.
      - name: Lint workflow files
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color -shellcheck= -pyflakes=
