name: CI

on:
  push:
    branches: [main]
  # NO `paths-ignore` HERE, DELIBERATELY, AND IT IS NOT ONLY ABOUT COST.
  #
  # The documentation filter this used to carry lives on the `build` job below
  # instead. The two look equivalent and are not: a workflow filtered at this
  # level produces NO RUN AT ALL, and three other things in this repository read
  # the run's existence rather than its result.
  #
  #   - `agent-review-panel.yml` and `agent-iterate-ci.yml` trigger on
  #     `workflow_run` of this file. No run means no event, so a PR confined to
  #     documentation never reached the autonomous loop: `@claude loop` labelled
  #     it `agent:managed` and nothing happened, and the verb's own confirmation
  #     comment had to say so.
  #   - `mark-ready.mjs`'s promotion gate reads this workflow's runs for the head
  #     sha and refuses on an empty list — correctly, "no evidence CI passed" is
  #     not "CI passed" — so a documentation PR could only ever be promoted by
  #     hand.
  #   - Required status checks. GitHub leaves a check Pending forever when its
  #     workflow is skipped by PATH FILTERING, and reports Success when a JOB is
  #     skipped by a conditional. Making `build` required would have deadlocked
  #     every documentation PR; with the filter on the job it does not.
  #
  # What it costs: `ci-target-check` below — one checkout and two path
  # evaluations, on the order of twenty seconds — now runs on every pull
  # request. `build` still does not, so no Go lane, no MongoDB and no `-race`
  # suite is spent on a documentation change. See
  # docs/design/agent-command-verbs.md §2.
  pull_request:
    branches: [main]

env:
  GO_VERSION: "1.25"

jobs:
  ci-target-check:
    runs-on: ubuntu-latest

    outputs:
      build: ${{ steps.code-changed.outputs.build }}
      bench: ${{ steps.ci-target-check.outputs.bench }}
      complex-test: ${{ steps.ci-target-check.outputs.complex-test }}
      load-test: ${{ steps.ci-target-check.outputs.load-test }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # THE DOCUMENTATION FILTER, moved off the workflow trigger (see the `on:`
      # block for why) and into its own step.
      #
      # ITS OWN STEP because `predicate-quantifier` is a STEP input and applies
      # to every filter in the block it is given. The filters below are lists of
      # ALTERNATIVES — a change under `test/bench/**` OR `pkg/**` runs the bench
      # lane — and `every` would require one file to match all of them at once,
      # which is essentially never true. Putting the two in one step disables the
      # three tag-gated lanes silently.
      #
      # WHAT `every` MEANS HERE, because the default gets this exactly backwards.
      # `dorny/paths-filter` evaluates a filter as: some changed FILE satisfies
      # the PATTERNS, where `every` ANDs the patterns per file and the default
      # `some` ORs them. So under the default, `['**', '!**/*.md']` is TRUE for a
      # lone `README.md` — it matches `**` — and the filter would never turn
      # anything off. Under `every`, a file counts when it matches `**` and none
      # of the negations, and the filter is true when at least one changed file
      # counts. That is precisely what `paths-ignore` meant.
      #
      # THE FAIL DIRECTION IS "RUN". The only positive pattern is `**`, so a path
      # nothing here mentions — a new directory, an unfamiliar extension —
      # counts, and `build` runs. Losing CI on code would take a negation that
      # matches a code path, and every negation below is a documentation
      # extension or a documentation directory. `checks.test.mjs` pins that
      # shape: `**` plus negations, nothing else.
      #
      # `**` covers `.gitignore` because the action matches with picomatch's
      # `{ dot: true }`; without that the last negation would be unreachable.
      - name: Does this pull request touch anything but documentation?
        uses: dorny/paths-filter@v3
        id: code-changed
        with:
          predicate-quantifier: every
          filters: |
            build:
              - '**'
              - '!api/docs/**'
              - '!build/charts/**'
              - '!design/**'
              - '!**/*.md'
              - '!**/*.txt'
              - '!**/.gitignore'

      - name: CI target check by path
        uses: dorny/paths-filter@v3
        id: ci-target-check
        with:
          filters: |
            bench:
              - 'test/bench/**'
              - 'pkg/**'
              - 'server/**'
              - 'client/**'
              - 'admin/**'
              - 'cluster/**'
              - 'api/converter/**'
            complex-test:
              - 'test/complex/**'
              - 'server/backend/database/**'
              - 'pkg/document/**'
              - 'client/**'
            load-test:
              - 'test/k6/**'
              - 'pkg/**'
              - 'server/**'
              - 'client/**'
              - 'admin/**'
              - 'cluster/**'
              - 'api/converter/**'

  build:
    name: build
    runs-on: ubuntu-latest

    needs: ci-target-check
    if: ${{ github.ref == 'refs/heads/main' || needs.ci-target-check.outputs.build == 'true' }}

    steps:
      - name: Set up Go ${{ env.GO_VERSION }}
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Set up buf
        # `bufbuild/buf-setup-action` and `bufbuild/buf-lint-action` are both
        # archived; `buf-action` is their successor. They came into scope when
        # `agent-scripts.yml` widened actionlint to the whole directory, and
        # actionlint reads an action's inputs, never its runtime — so an
        # archived action aging out would surface only as a startup failure
        # on whichever PR next ran this job. `setup_only` because the steps
        # below already run the CLI directly.
        #
        # `version` is the default `buf-setup-action@v1` installed, stated
        # because `buf-action` has none of its own: swapping the action must
        # not also swap the CLI that lint, breaking and generate run with.
        #
        # SHA-PINNED, following the rule `codecov-action` below states:
        # anything handed a secret.
        uses: bufbuild/buf-action@85aebf73123b5c15fd5528aaecbf9129cddf7fa7 # v1.6.0
        with:
          setup_only: true
          version: 1.50.0
          github_token: ${{ github.token }}

      - name: Check out code
        uses: actions/checkout@v4

      - name: Get tools dependencies
        run: make tools

      - name: Lint
        run: make lint

      - name: Verify licence headers
        # Here rather than in the unfiltered `docs.yml`, because
        # `agent-iterate-ci.yml` subscribes to CI alone and the review panel
        # reads CI's conclusion alone: a gate that reds only in another
        # workflow stops an agent-managed PR with nothing watching it.
        # This job's documentation filter costs the check nothing — it reads
        # `.go` files, and none of the filtered paths can hold one.
        #
        # `node …`, not `make verify-license`: that target announces SKIPPED
        # when Node is absent, and a CI gate must not fail open.
        run: node scripts/verify-license.mjs

      - name: Lint proto files
        # `buf.work.yaml` points the workspace at `api/`, which is how the
        # `buf breaking` and `buf generate` steps below resolve too.
        run: buf lint

      - name: Check proto for breaking changes
        # api/buf.yaml has configured `breaking: use: FILE` since before this
        # job existed, but nothing ever ran it. Wire changes are the one kind
        # this repository cannot walk back: a rolled-back server has to keep
        # decoding changes it already stored.
        #
        # Compared against the pull request's own base commit, not against the
        # tip of main. Against a moving tip, a PR branched from an older main
        # inherits every proto change that landed since and can be failed for
        # something it did not do; and for a stacked PR, main is not the base
        # it is proposing to change at all.
        if: github.event_name == 'pull_request'
        run: |
          buf breaking --against \
            "https://github.com/yorkie-team/yorkie.git#ref=${{ github.event.pull_request.base.sha }}"

      - name: Check generated code is up to date
        # Two independent drifts reached main without this. The Makefile pinned
        # the connect generator to a version older than the connect library in
        # go.mod, so contributors rewrote whichever generated files their own
        # plugin disagreed with, and the OpenAPI docs went eleven releases
        # without being regenerated at all.
        #
        # Scoped to api/ because that is where every buf.gen.yaml output goes,
        # and because a repository-wide check would also see artefacts left by
        # the steps above and fail for reasons that have nothing to do with
        # codegen. Untracked files count: `git diff` alone would not notice a
        # brand new generated file that was never committed.
        run: |
          buf generate
          if [ -n "$(git status --porcelain --untracked-files=all -- api/)" ]; then
            echo "::error::Generated code is stale. Run 'make tools && buf generate' and commit the result."
            git status --short -- api/
            git diff -- api/
            exit 1
          fi

      - name: Build
        run: make build

      - name: Vet tag-gated reproductions
        # Files behind a build tag are not compiled by any other job, so a
        # refactor can break them without CI noticing. Vet compiles them
        # without running them: the reproductions are expected to FAIL when
        # run, and that is the point of them, so they must never be executed
        # here. See docs/tasks/active/ for what each tag reproduces.
        run: go vet -tags rgafuzz ./...

      - name: Stack
        run: docker compose -f build/docker/docker-compose.yml up --build -d

      - name: Test
        run: go test -tags integration -race -coverpkg=./... -coverprofile=coverage.txt -covermode=atomic -v ./...

      - name: Upload coverage to Codecov
        # v3 runs on a Node version current runners no longer provide, which
        # actionlint reports as "too old to run on GitHub Actions". The input
        # was renamed on the way: `file` became `files` in v4, and v3's name
        # is accepted-and-ignored rather than rejected, so carrying it over
        # would upload nothing and still go green.
        #
        # SHA-PINNED, unlike the `@v4`-style tags elsewhere in this file, and
        # the rule it follows is "anything handed a secret". This step receives
        # `secrets.CODECOV_TOKEN` in a job that also holds the full workspace
        # and GITHUB_TOKEN; the repository's only other SHA pins are the two
        # actions that mint credentials. A mutable tag there is a different
        # bet from a mutable tag on `actions/checkout`.
        #
        # v5 rather than the current v7: this pin is the version whose upload
        # step is observed green on this pull request's `build` run. Dependabot
        # watches the github-actions ecosystem and rewrites SHA pins with their
        # version comment, so the bump arrives through review rather than here.
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5
        with:
          files: ./coverage.txt
          token: ${{ secrets.CODECOV_TOKEN }}

  bench:
    name: bench
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    needs: ci-target-check
    if: ${{ github.ref == 'refs/heads/main' || needs.ci-target-check.outputs.bench == 'true' }}

    steps:
      - name: Set up Go ${{ env.GO_VERSION }}
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Set up Node.js
        if: github.event_name == 'pull_request' && github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Claude Code CLI
        # PINNED, because of what this job holds. `bench` runs with
        # `contents: write`, `pull-requests: write`, GITHUB_TOKEN and
        # CLAUDE_CODE_OAUTH_TOKEN, and an unpinned global install resolves
        # whatever was published minutes ago.
        #
        # Not the same risk as the `@v4` action tags around it, which is why
        # this one is worth a version and they are left alone: a tag is a ref
        # its publisher moves deliberately, while `npm install -g` with no
        # version re-resolves on every run. (Of the actions in this
        # repository only two are SHA-pinned — the two that mint credentials.
        # Whether that line should be "anything touching a secret" is a
        # separate question from this one.)
        #
        # Tracks the `stable` dist-tag, not `latest`, which is ahead of it.
        # Dependabot cannot see this — its npm ecosystem reads manifests, and
        # this is an argument in a run step — so bumping it is manual.
        if: github.event_name == 'pull_request' && github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
        run: npm install -g @anthropic-ai/claude-code@2.1.273

      - name: Checkout current repository
        uses: actions/checkout@v4
        with:
          path: repo

      - name: Checkout benchmark branch
        uses: actions/checkout@v4
        with:
          ref: yorkie-ci-benchmark
          path: benchmark-repo
        continue-on-error: true

      - name: Read previous benchmark result
        if: github.event_name == 'pull_request' && github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
        id: prev-bench
        run: |
          echo "PREV_BENCH_RESULT=null" >> $GITHUB_OUTPUT
          echo "PREV_COMMIT=null" >> $GITHUB_OUTPUT

          if [ -d "benchmark-repo" ] && [ -f "benchmark-repo/bench_result.txt" ]; then
            content=$(cat benchmark-repo/bench_result.txt | jq -R -s .)
            echo "PREV_BENCH_RESULT=$content" >> $GITHUB_OUTPUT
            if [ -f "benchmark-repo/commit_hash.txt" ]; then
              prev_commit=$(cat benchmark-repo/commit_hash.txt)
              echo "PREV_COMMIT=$prev_commit" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Stack
        run: docker compose -f repo/build/docker/docker-compose.yml up --build -d

      - name: Bench
        id: curr-bench
        run: |
          cd repo
          make bench
          content=$(cat output.txt | jq -R -s .)
          echo "BENCH_RESULT=$content" >> $GITHUB_OUTPUT

      - name: Parse benchmark results
        if: github.event_name == 'pull_request' && github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
        id: bench-parse
        env:
          PREV_BENCH_RESULT: ${{ steps.prev-bench.outputs.PREV_BENCH_RESULT }}
          CURR_BENCH_RESULT: ${{ steps.curr-bench.outputs.BENCH_RESULT }}
        run: |
          PARSED=$(node repo/scripts/ci/parse-bench.js)
          EOF_MARKER="BENCH_PARSE_EOF_$(date +%s)"
          echo "PARSED<<${EOF_MARKER}" >> $GITHUB_OUTPUT
          echo "$PARSED" >> $GITHUB_OUTPUT
          echo "${EOF_MARKER}" >> $GITHUB_OUTPUT

      - name: Analyze benchmark with Claude
        if: github.event_name == 'pull_request' && github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
        id: bench-analysis
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          PARSED: ${{ steps.bench-parse.outputs.PARSED }}
        run: |
          SIGNIFICANT=$(echo "$PARSED" | jq -r '.significantChangesTable // ""')
          GROUPED=$(echo "$PARSED" | jq -r '.groupedTable // ""')

          if [ -z "$SIGNIFICANT" ]; then
            echo "ANALYSIS=No significant benchmark changes detected." >> $GITHUB_OUTPUT
            echo "VV_ANALYSIS=" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Write prompt to a file to avoid shell injection
          cat > /tmp/bench-prompt.txt << 'PROMPT_EOF'
          Analyze these Go benchmark changes (≥20% difference). Write 2-3 key observations as markdown bullets. Be concise, data-driven.
          PROMPT_EOF
          echo "" >> /tmp/bench-prompt.txt
          echo "Significant changes:" >> /tmp/bench-prompt.txt
          echo "$SIGNIFICANT" >> /tmp/bench-prompt.txt
          echo "" >> /tmp/bench-prompt.txt
          echo "Full data:" >> /tmp/bench-prompt.txt
          echo "$GROUPED" >> /tmp/bench-prompt.txt

          ANALYSIS=$(claude -p "$(cat /tmp/bench-prompt.txt)" --model claude-sonnet-4-20250514 2>/dev/null || echo "Analysis unavailable.")

          # Write analysis to file to avoid shell injection in later steps
          echo "$ANALYSIS" > /tmp/bench-analysis.txt

          EOF_MARKER="ANALYSIS_EOF_$(date +%s)"
          echo "ANALYSIS<<${EOF_MARKER}" >> $GITHUB_OUTPUT
          echo "$ANALYSIS" >> $GITHUB_OUTPUT
          echo "${EOF_MARKER}" >> $GITHUB_OUTPUT

          HAS_VV=$(echo "$PARSED" | jq -r '.hasVersionVector // false')
          if [ "$HAS_VV" = "true" ]; then
            VV_DATA=$(echo "$PARSED" | jq -r '[.grouped | to_entries[] | select(.key | test("VersionVector|SyncConcurrency"))] | map("\(.key): \(.value | tostring)") | join("\n")')

            cat > /tmp/vv-prompt.txt << 'PROMPT_EOF'
          Compare Lamport vs VersionVector performance from this benchmark data. Provide a concise summary.
          PROMPT_EOF
            echo "" >> /tmp/vv-prompt.txt
            echo "$VV_DATA" >> /tmp/vv-prompt.txt

            VV_ANALYSIS=$(claude -p "$(cat /tmp/vv-prompt.txt)" --model claude-sonnet-4-20250514 2>/dev/null || echo "")
            echo "$VV_ANALYSIS" > /tmp/vv-analysis.txt

            EOF_VV="VV_EOF_$(date +%s)"
            echo "VV_ANALYSIS<<${EOF_VV}" >> $GITHUB_OUTPUT
            echo "$VV_ANALYSIS" >> $GITHUB_OUTPUT
            echo "${EOF_VV}" >> $GITHUB_OUTPUT
          else
            echo "VV_ANALYSIS=" >> $GITHUB_OUTPUT
            echo "" > /tmp/vv-analysis.txt
          fi

      - name: Post benchmark comment to PR
        if: github.event_name == 'pull_request' && github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PARSED: ${{ steps.bench-parse.outputs.PARSED }}
        run: |
          SIGNIFICANT_TABLE=$(echo "$PARSED" | jq -r '.significantChangesTable // ""')
          GROUPED_TABLE=$(echo "$PARSED" | jq -r '.groupedTable // ""')
          COMMIT_ID="${{ github.sha }}"
          PREV_COMMIT_ID="${{ steps.prev-bench.outputs.PREV_COMMIT }}"

          # Read LLM outputs from files (safe, no shell injection)
          ANALYSIS=$(cat /tmp/bench-analysis.txt 2>/dev/null || echo "")
          VV_ANALYSIS=$(cat /tmp/vv-analysis.txt 2>/dev/null || echo "")

          VV_SECTION=""
          if [ -n "$VV_ANALYSIS" ]; then
            VV_SECTION="### Clock Analysis

          <details>
          <summary>Lamport vs VersionVector</summary>

          ${VV_ANALYSIS}

          </details>"
          fi

          cat > /tmp/bench-comment.md << COMMENT_EOF
          <!-- yorkie-ci-benchmark comment -->
          ## Go Benchmark Analysis 📊

          This is a comparison result between the previous(${PREV_COMMIT_ID}) and the current commit(${COMMIT_ID}).

          ### Significant Changes (≥20% difference)

          ${SIGNIFICANT_TABLE}

          ${ANALYSIS}

          ${VV_SECTION}

          ### Detailed Test Results

          ${GROUPED_TABLE}
          COMMENT_EOF

          bash repo/scripts/ci/post-comment.sh \
            "${{ github.repository }}" \
            "${{ github.event.pull_request.number }}" \
            "<!-- yorkie-ci-benchmark comment -->" \
            /tmp/bench-comment.md

      - name: Store benchmark result
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p benchmark-repo
          cp repo/output.txt benchmark-repo/bench_result.txt
          echo "${{ github.sha }}" > benchmark-repo/commit_hash.txt

          cd benchmark-repo
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

          if [ ! -d ".git" ]; then
            git init
            git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
          fi

          git add -f bench_result.txt commit_hash.txt
          TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
          git diff --staged --quiet || git commit -m "Update benchmark results at $TIMESTAMP"
          git checkout -B yorkie-ci-benchmark
          git push -f origin yorkie-ci-benchmark

          echo "Benchmark results have been pushed to yorkie-ci-benchmark branch"

  complex-test:
    name: complex-test
    runs-on: ubuntu-latest

    needs: ci-target-check
    if: ${{ github.ref == 'refs/heads/main' || needs.ci-target-check.outputs.complex-test == 'true' }}

    steps:
      - name: Set up Go ${{ env.GO_VERSION }}
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Check out code
        uses: actions/checkout@v4

      - name: Check Docker Compose Version
        run: docker compose --version

      - name: Run the Config server, Shard 1 and Shard 2
        run: docker compose -f build/docker/sharding/docker-compose.yml up --build -d --wait config1 shard1-1 shard2-1

      - name: Initialize the Config server
        run: docker compose -f build/docker/sharding/docker-compose.yml exec config1 mongosh test /scripts/init-config1.js

      - name: Initialize the Shard 1
        run: docker compose -f build/docker/sharding/docker-compose.yml exec shard1-1 mongosh test /scripts/init-shard1-1.js

      - name: Initialize the Shard 2
        run: docker compose -f build/docker/sharding/docker-compose.yml exec shard2-1 mongosh test /scripts/init-shard2-1.js

      - name: Run the Mongos
        run: docker compose -f build/docker/sharding/docker-compose.yml up --build -d --wait mongos1

      - name: Initialize the Mongos
        run: docker compose -f build/docker/sharding/docker-compose.yml exec mongos1 mongosh test /scripts/init-mongos1.js

      - name: Run the tests with complex tag
        run: go test -tags complex -race -v ./test/complex/...

  load-test:
    name: load-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    needs: ci-target-check
    if: ${{ github.ref == 'refs/heads/main' || needs.ci-target-check.outputs.load-test == 'true' }}

    steps:
      - name: Set up Go ${{ env.GO_VERSION }}
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Set up Node.js
        if: github.event_name == 'pull_request' && github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Checkout current repository
        uses: actions/checkout@v4
        with:
          path: repo
      - name: Stack
        run: docker compose -f repo/build/docker/docker-compose.yml up --build -d

      - name: Checkout load branch
        uses: actions/checkout@v4
        with:
          ref: yorkie-ci-load
          path: load-repo
        continue-on-error: true

      - name: Read previous load result
        if: github.event_name == 'pull_request' && github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
        id: prev-load
        run: |
          echo "PREV_LOAD_RESULT=null" >> $GITHUB_OUTPUT
          echo "PREV_LOAD_SUMMARY=null" >> $GITHUB_OUTPUT
          echo "PREV_COMMIT=null" >> $GITHUB_OUTPUT

          if [ -d "load-repo" ] && [ -f "load-repo/load_summary.json" ]; then
            content=$(cat load-repo/output.txt | jq -R -s .)
            echo "PREV_LOAD_RESULT=$content" >> $GITHUB_OUTPUT
            echo "PREV_LOAD_SUMMARY=$(jq -c . load-repo/load_summary.json)" >> $GITHUB_OUTPUT
            if [ -f "load-repo/commit_hash.txt" ]; then
              prev_commit=$(cat load-repo/commit_hash.txt)
              echo "PREV_COMMIT=$prev_commit" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Setup K6
        uses: grafana/setup-k6-action@v1

      - name: Start the server
        run: cd repo && make start

      - name: Run Presence Load test
        id: curr-load
        run: |
          cd repo
          sleep 5
          if ! k6 run test/k6/presence.ts --summary-export=summary.json | tee output.txt; then
           echo "::error::K6 load test failed"
           exit 1
          fi
          echo "LOAD_RESULT=$(cat output.txt | jq -R -s .)" >> $GITHUB_OUTPUT
          echo "LOAD_SUMMARY=$(jq -c . summary.json)" >> $GITHUB_OUTPUT
      - name: Run Stream Load test
        id: curr-load-stream
        run: |
          cd repo
          k6 run test/k6/presence-with-stream.ts
      - name: Run VersionVector Load test
        id: curr-load-versionvector
        run: |
          cd repo
          k6 run -e WITH_VERSION_VECTOR=true test/k6/presence.ts
      - name: Stop the server
        run: cd repo && make stop

      - name: Parse load test results
        if: github.event_name == 'pull_request' && github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
        id: load-parse
        env:
          CURR_LOAD_RESULT: ${{ steps.curr-load.outputs.LOAD_RESULT }}
          CURR_LOAD_SUMMARY: ${{ steps.curr-load.outputs.LOAD_SUMMARY }}
          PREV_LOAD_SUMMARY: ${{ steps.prev-load.outputs.PREV_LOAD_SUMMARY }}
        run: |
          PARSED=$(node repo/scripts/ci/parse-load.js)
          EOF_MARKER="LOAD_PARSE_EOF_$(date +%s)"
          echo "PARSED<<${EOF_MARKER}" >> $GITHUB_OUTPUT
          echo "$PARSED" >> $GITHUB_OUTPUT
          echo "${EOF_MARKER}" >> $GITHUB_OUTPUT

      - name: Post load test comment to PR
        if: github.event_name == 'pull_request' && github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PARSED: ${{ steps.load-parse.outputs.PARSED }}
        run: |
          CHANGE_TABLE=$(echo "$PARSED" | jq -r '.table // ""')
          RESULT=$(echo "$PARSED" | jq -r '.result // ""')
          COMMIT_ID="${{ github.sha }}"
          PREV_COMMIT_ID="${{ steps.prev-load.outputs.PREV_COMMIT }}"

          CHANGE_SECTION=""
          if [ -n "$CHANGE_TABLE" ] && [ "$CHANGE_TABLE" != "null" ]; then
            CHANGE_SECTION="### Change

          ${CHANGE_TABLE}"
          fi

          cat > /tmp/load-comment.md << COMMENT_EOF
          <!-- yorkie-ci-load comment -->
          ## k6 Load Test 📊

          This is a comparison result between the previous(${PREV_COMMIT_ID}) and the current commit(${COMMIT_ID}).

          ${CHANGE_SECTION}

          ### Result

          <details>
          <summary>Full k6 output</summary>

          ${RESULT}

          </details>
          COMMENT_EOF

          bash repo/scripts/ci/post-comment.sh \
            "${{ github.repository }}" \
            "${{ github.event.pull_request.number }}" \
            "<!-- yorkie-ci-load comment -->" \
            /tmp/load-comment.md

      - name: Store load result
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p load-repo
          cp repo/summary.json load-repo/load_summary.json
          cp repo/output.txt load-repo/output.txt
          echo "${{ github.sha }}" > load-repo/commit_hash.txt

          cd load-repo
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

          if [ ! -d ".git" ]; then
            git init
            git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
          fi

          git add -f load_summary.json output.txt commit_hash.txt
          TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
          git diff --staged --quiet || git commit -m "Update load results at $TIMESTAMP"
          git checkout -B yorkie-ci-load
          git push -f origin yorkie-ci-load

          echo "load results have been pushed to yorkie-ci-load branch"
