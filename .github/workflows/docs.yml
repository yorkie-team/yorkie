# A workflow of its own, because ci.yml sets `paths-ignore: "**/*.md"` — every
# job there is skipped on exactly the pull requests these checks exist to
# police. Adding a step to that workflow would look like coverage and provide
# none.
#
# The name — and the `doc-links` job id — are narrower than the contents: this
# is where the Node-based repository checks live that must run on EVERY pull
# request. Today that is the documentation link graph and the licence headers.
# Renaming would churn a status-check context for no gain, so the comment
# carries the correction instead.
#
# NO PATH FILTER, deliberately, and for both checks.
#
# A link breaks when its TARGET moves, and targets are not only markdown.
# Walked with the checker's own `linkTargets` from its three roots, the graph
# reaches 155 markdown files and 39 non-markdown ones: 35 images under
# `docs/design/media/`, three script directories reached through their
# READMEs, and this workflow file. Renaming or deleting any of those breaks a
# link without touching a single `.md`. (There are no relative `.go` targets —
# every Go citation in `docs/design/` is an absolute GitHub URL, which the
# checker skips as a scheme. An earlier version of this comment claimed
# otherwise and was not checked.)
#
# A licence header is likewise removable by a change `**/*.md` would skip.
#
# The job installs Node and reads text — seconds — so filtering buys nothing
# worth a hole in the only checks that watch either.
name: Docs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Read-only: this job needs the tree and nothing else.
permissions:
  contents: read

jobs:
  doc-links:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # No workflow step here talks to the API, so leaving the token in
          # .git/config would be a credential nothing needs.
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify documentation links
        run: node scripts/verify-doc-links.mjs

      # Lives here rather than in ci.yml for the same reason the link check
      # does: this workflow has no path filter. ci.yml would cover a new .go
      # file, but a licence header can also be removed by a change that
      # `paths-ignore` skips, and this job already has Node.
      - name: Verify licence headers
        run: node scripts/verify-license.mjs

      # The glob, not the directory: `node --test scripts/test/` tries to load
      # the directory as a module and dies with MODULE_NOT_FOUND.
      - name: Test the link checker
        run: node --test 'scripts/test/**/*.test.mjs'
