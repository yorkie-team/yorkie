# A workflow of its own, because ci.yml sets `paths-ignore: "**/*.md"` — every
# job there is skipped on exactly the pull requests this check exists to
# police. Adding a step to that workflow would look like coverage and provide
# none.
#
# The licence gate is NOT here, though it is also a Node script: it reads only
# `.go` files, which no ignored path can hold, so ci.yml covers every change
# that could break it — and ci.yml is the workflow the autonomous CI-fix loop
# subscribes to. A gate that reds only here stops an agent-managed PR with
# nothing watching it.
#
# NO PATH FILTER, deliberately.
#
# A link breaks when its TARGET moves, and targets are not only markdown.
# Walked with the checker's own `linkTargets` from its three roots, the graph
# reaches 39 non-markdown targets: 35 images under `docs/design/media/`, three
# script directories reached through their READMEs, and this workflow file.
# (The breakdown is the durable part — a count of the markdown files it walks
# would change on every PR that adds a doc, and nothing checks it.) Renaming
# or deleting any of those breaks a link without touching a single `.md`.
# There are no relative `.go` targets: every Go citation in `docs/design/` is
# an absolute GitHub URL, which the checker skips as a scheme.
#
# The job installs Node and reads text — seconds — so filtering buys nothing
# worth a hole in the only check that watches links.
name: Docs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Read-only: this job needs the tree and nothing else.
permissions:
  contents: read

jobs:
  doc-links:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # No workflow step here talks to the API, so leaving the token in
          # .git/config would be a credential nothing needs.
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify documentation links
        run: node scripts/verify-doc-links.mjs

      # The other direction, and a step of its own so a failure names which
      # question broke: the link check polices the index's claims, this one its
      # silences. It also prints — without failing — any finished task record
      # still sitting in `docs/tasks/active/`, which is how drift on `main`
      # becomes visible on the next push. See the script's header for why that
      # half does not gate.
      - name: Verify documentation coverage
        run: node scripts/verify-doc-index.mjs

      # The glob, not the directory: `node --test scripts/test/` tries to load
      # the directory as a module and dies with MODULE_NOT_FOUND.
      - name: Test the repository checks
        run: node --test 'scripts/test/**/*.test.mjs'
