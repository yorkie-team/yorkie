name: Base Docker Publish
on:
  workflow_call:
    inputs:
      command:
        # No default: the input is required, so a default can never be used,
        # and actionlint reports the pair. Required is the half to keep —
        # both callers pass it explicitly, and a default that silently
        # published the `docker` tag for a caller that meant `docker-latest`
        # is the wrong direction to fail in.
        description: make command to run — `docker` or `docker-latest`
        required: true
        type: string
jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go 1.25
        uses: actions/setup-go@v6
        with:
          go-version: 1.25

      - name: Use docker buildx
        run: docker buildx create --use

      - name: Get tools dependencies
        run: make tools

      - name: Build
        run: make build

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Image
        env:
          COMMAND: ${{ inputs.command }}
        run: make $COMMAND
